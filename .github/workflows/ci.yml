name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: lint test assemble
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: No AI attribution
        run: ./scripts/no-ai-attribution.sh check

      - name: Copy punctuation check
        run: |
          forbidden="$(printf '\342\200\224')"
          if git grep -n "$forbidden" -- .; then
            echo "Use commas, periods, parentheses, or colons instead." >&2
            exit 1
          fi

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: lintDebug testDebugUnitTest assembleDebug
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
